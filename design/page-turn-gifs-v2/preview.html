<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page opening animations</title><style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#dedbd4;color:#24231f;font:16px system-ui}main{max-width:1100px;margin:auto}h1{font-size:28px;margin-bottom:8px}p{color:#57534b}section{display:grid;grid-template-columns:1fr 1fr;gap:20px}article{background:#eeeae3;border-radius:16px;padding:20px}img{display:block;width:100%;height:280px;object-fit:contain}h2{font-size:18px}button,a{font:inherit;color:inherit}button{background:#24231f;color:white;border:0;border-radius:8px;padding:10px 15px;cursor:pointer}a{margin-left:16px}button:focus-visible,a:focus-visible{outline:3px solid #5176b7;outline-offset:4px}@media(max-width:700px){section{grid-template-columns:1fr}body{padding:20px}}</style><main><h1>Open the next page — revised</h1><p>Four transparent GIFs. Each plays once in 1 second, then holds the inside artwork. Click Replay to watch again.</p><section id="grid"></section><p>Revised to follow your six-frame opening examples, with the new inside illustrations.  Looping copies are also included.</p></main><script>const items=[['contact','Contact'],['about-me','About Me'],['ui-design','UI Design'],['illustration','Illustration']];for(const [slug,title] of items){const article=document.createElement('article');article.innerHTML=`<h2>${title}</h2><img src="${slug}.gif" alt="${title} book opening to its inside illustration"><button type="button">Replay</button><a href="${slug}.gif" download>Download GIF</a>`;article.querySelector('button').onclick=()=>article.querySelector('img').src=slug+'.gif?t='+Date.now();document.querySelector('#grid').append(article)}</script></html>
